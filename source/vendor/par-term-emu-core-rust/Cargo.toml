    "development-tools",
    "api-bindings",
]
license = "MIT"
repository = "https://github.com/paulrobello/par-term-emu-core-rust"

[features]
default = ["python"]
full = [
    "python",
    "streaming",
    "streaming-bin",
]
jemalloc = ["tikv-jemallocator"]
pty_session = [
    "portable-pty",
    "nix",
]
