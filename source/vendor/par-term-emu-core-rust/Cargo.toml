    "pyo3",
    "pyo3/extension-module",
    "par-term-emu-derive",
    "pty_session",
]
regenerate-proto = ["prost-build"]
rust-only = []
sim = []
streaming = [
    "tokio",
    "tokio-tungstenite",
    "axum",
    "tower-http",
    "futures-util",
